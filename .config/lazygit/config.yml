gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#FFA066"
      - "bold"
    inactiveBorderColor:
      - "#54546D"
    searchingActiveBorderColor:
      - "#76946A"
      - "bold"
    optionsTextColor:
      - "#7E9CD8"
    selectedLineBgColor:
      - "#2A2A37"
    cherryPickedCommitFgColor:
      - "#7E9CD8"
    cherryPickedCommitBgColor:
      - "#957FB8"
    markedBaseCommitFgColor:
      - "#7E9CD8"
    markedBaseCommitBgColor:
      - "#e6c384"
    unstagedChangesColor:
      - "#C34043"
    defaultFgColor:
      - "#dcd7ba"
git:
  diffRenderers:
    # Kanagawa temasi, side-by-side ve dekorasyonlar ~/.gitconfig'teki delta ayarlarindan miras alinir.
    # hyperlinks-file-link-format: diff'te dosya adina tiklayinca lazygit'in editorunu acar.
    - type: stdinFilter
      colorArg: always
      command: delta --dark --paging=never --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    # AST tabanli diff: formatlama mi mantik mi degismis sorusunu ayirir. delta'nin yanina gelir, yerine gecmez.
    - name: difftastic
      type: extDiff
      colorArg: always
      command: difft --color=always --display=inline

customCommands:
  # Secili commit'i parent'iyla CodeDiff'te acar. lazygit acik kalir, nvim ayri tmux penceresinde.
  - key: "X"
    context: "commits, subCommits, reflogCommits"
    description: "CodeDiff in new tmux window"
    command: 'tmux new-window -n " CodeDiff" "nvim ''+CodeDiff {{.SelectedLocalCommit.Sha}}~1 {{.SelectedLocalCommit.Sha}}''"'
    output: none
