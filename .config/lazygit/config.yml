gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#FFA066"
      - "bold"
    inactiveBorderColor:
      - "#54546D"
    searchingActiveBorderColor:
      - "#76946A"
      - "bold"
    optionsTextColor:
      - "#7E9CD8"
    selectedLineBgColor:
      - "#2A2A37"
    cherryPickedCommitFgColor:
      - "#7E9CD8"
    cherryPickedCommitBgColor:
      - "#957FB8"
    markedBaseCommitFgColor:
      - "#7E9CD8"
    markedBaseCommitBgColor:
      - "#e6c384"
    unstagedChangesColor:
      - "#C34043"
    defaultFgColor:
      - "#dcd7ba"
git:
  diffRenderers:
    # Kanagawa theme, side-by-side and decorations are inherited from the delta settings in ~/.gitconfig.
    # hyperlinks-file-link-format: clicking a file name in the diff opens lazygit's editor.
    - type: stdinFilter
      colorArg: always
      command: delta --dark --paging=never --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    # AST-based diff: separates formatting changes from logic changes. It sits next to delta, not in its place.
    - name: difftastic
      type: extDiff
      colorArg: always
      command: difft --color=always --display=inline

customCommands:
  # Opens the selected commit against its parent in CodeDiff. lazygit stays open, nvim in its own tmux window.
  - key: "X"
    context: "commits, subCommits, reflogCommits"
    description: "CodeDiff in new tmux window"
    command: 'tmux new-window -n " CodeDiff" "nvim ''+CodeDiff {{.SelectedLocalCommit.Sha}}~1 {{.SelectedLocalCommit.Sha}}''"'
    output: none
