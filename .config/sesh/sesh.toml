# Fail on an unknown key instead of passing over it silently.
strict_mode = true

# Name worktree sessions after their own parent directory, not the repo root:
# "<repo>/_worktrees/fix-GD-536-apk-cache" -> "fix-GD-536-apk-cache".
git_namer_use_worktree_root = true

[default_session]
preview_command = "eza -la --all --git --icons --color=always {}"

[[session]]
name = "📝 Notes"
alias = "nt"
alias_auto_connect = true
path = "~/obsidian-vault"
startup_command = 'nvim +GoToFile'

[[session]]
name = "🏠 Home (~)"
alias = "hme"
path = "~/"

[[session]]
name = "🔧 Config"
alias = "cf"
alias_auto_connect = true
path = "~/.config"
startup_command = 'nvim +GoToFile'

[[session]]
name = "📂 Workspace"
alias = "ws"
path = "~/workspace"

[[session]]
name = "📥 Downloads"
alias = "dl"
path = "~/Downloads"
startup_command = "yazi"

[[session]]
name = "🧩 Dotfiles"
alias = "df"
alias_auto_connect = true
path = "~/workspace/dotfiles"
startup_command = "nvim +GoToFile"

[[session]]
name = "🐳 LazyDocker"
alias = "lzd"
alias_auto_connect = true
path = "~/Library/Application Support/lazydocker"
startup_command = "lazydocker"
preview_command = "bat --language=yaml --style=snip --color=always ~/Library/Application Support/lazydocker/config.yml"

[[session]]
name = "🗄 LazySQL"
alias = "lsq"
alias_auto_connect = true
path = "~/Library/Application Support/lazysql"
startup_command = "lazysql"
preview_command = "bat --language=bash --style=snip --color=always ~/Library/Application Support/lazysql/config.toml"

[[session]]
name = "📰 Rss Feeds"
alias = "rss"
path = "~/.newsboat"
startup_command = "newsboat -r"
preview_command = "~/.config/sesh/rss-preview.sh"


[[session]]
name = "🎤 Presents"
alias = "prs"
path = "~/Documents/presents"
startup_command = "nvim +GoToFile"

[[session]]
name = "💼 Main"
alias = "gc"
alias_auto_connect = true
path = "$WORK_MAIN"
# Keep gh dash in window 1: the `windows` list always opens after 1, while
# startup_command lands in window 1. Creating a named window turns
# automatic-rename off, so it is turned back on in the shell window -
# the nerd-font/claude-state glyphs come from there.
startup_command = "tmux set -w -t 2 automatic-rename on; gh dash"
windows = ["shell"]

[[session]]
name = "💼 Notif"
alias = "gn"
alias_auto_connect = true
path = "$WORK_NOTIF"

[[session]]
name = "💼 Lib"
alias = "gl"
alias_auto_connect = true
path = "$WORK_LIB"

[[session]]
name = "💼 Translate"
alias = "tt"
path = "$WORK_TRANSLATE"


[[session]]
name= "🔑 Reset Admin Pass"
alias = "rstpw"
path = "$WORK_BIN"
startup_command="./reset-admin-password.sh; read -P 'enter to continue...'; exit"

[[window]]
name = "shell"

# Entering a worktree should land straight in the file picker.
# Note: only startup_command works inside [[wildcard]] - preview_command is never
# read on the wildcard path (the previewer only looks at named [[session]] blocks).
[[wildcard]]
pattern = "$WORK_MAIN/.worktrees/*"
startup_command = "nvim +GoToFile"

# `sesh worktree` arrived in 2.29.0, but turning it on means writing the org/repo
# name into this repo: the `repo` field is NOT env-expanded (only `path` is) and
# `sesh worktree list`/`picker` errors out when repo is empty. `[[import]]` does not
# solve it either - import only merges session/window/wildcard blocks and skips
# worktree. This repo is public, so it stays off until that is decided.
#   sesh worktree connect --pr 3198  ->  .worktrees/3198 altinda gh pr checkout
# It does not clash with the existing branch-named worktrees (those are
# .worktrees/<branch-name>) and `list` only counts number-named directories, so it
# never sees them. Overriding worktree_dir + base_branch is required: sesh defaults
# to .wk and origin/main. branch_template is not needed: Connect tries `gh pr view`
# first and, for a PR, goes detached + `gh pr checkout` without ever using the
# template; our issues live in Jira.
#
# [[worktree]]
# repo = "<org>/<main-repo>"   # must be literal, $WORK_* does not work here
# path = "$WORK_MAIN"
# worktree_dir = ".worktrees"
# base_branch = "origin/master"
# create_command = "nvim +GoToFile"
# startup_command = "nvim +GoToFile"
#
# [[worktree]]
# repo = "<org>/<teli-repo>"   # must be literal, $WORK_* does not work here
# path = "$WORK_TELI"
# worktree_dir = ".worktrees"
# base_branch = "origin/master"
# create_command = "nvim +GoToFile"
# startup_command = "nvim +GoToFile"
#
# Zen (Firefox-based) will not give the active tab URL over AppleScript - it has no
# sdef, and both `active tab` and `front document` return -1728. --browser does not
# work, the PR number has to be passed by hand.
# [browser]
# application = "Zen"
