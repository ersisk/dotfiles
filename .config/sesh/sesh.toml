[default_session]
preview_command = "eza -la --all --git --icons --color=always {}"

[[session]]
name = "📝 Notes"
alias = "nt"
alias_auto_connect = true
path = "~/obsidian-vault"
startup_command = 'nvim +GoToFile'

[[session]]
name = "🏠 Home (~)"
alias = "hme"
path = "~/"

[[session]]
name = "🔧 Config"
alias = "cf"
alias_auto_connect = true
path = "~/.config"
startup_command = 'nvim +GoToFile'

[[session]]
name = "📂 Workspace"
alias = "ws"
path = "~/workspace"

[[session]]
name = "📥 Downloads"
alias = "dl"
path = "~/Downloads"
startup_command = "yazi"

[[session]]
name = "🧩 Dotfiles"
alias = "df"
alias_auto_connect = true
path = "~/workspace/dotfiles"
startup_command = "nvim +GoToFile"

[[session]]
name = "🐳 LazyDocker"
alias = "lzd"
alias_auto_connect = true
path = "~/Library/Application Support/lazydocker"
startup_command = "lazydocker"
preview_command = "bat --language=yaml --style=snip --color=always ~/Library/Application Support/lazydocker/config.yml"

[[session]]
name = "🗄 LazySQL"
alias = "lsq"
alias_auto_connect = true
path = "~/Library/Application Support/lazysql"
startup_command = "lazysql"
preview_command = "bat --language=bash --style=snip --color=always ~/Library/Application Support/lazysql/config.toml"

[[session]]
name = "📰 Rss Feeds"
alias = "rss"
path = "~/.newsboat"
startup_command = "newsboat -r"
preview_command = "~/.config/sesh/rss-preview.sh"


[[session]]
name = "🎤 Presents"
alias = "prs"
path = "~/Documents/presents"
startup_command = "nvim +GoToFile"

[[session]]
name = "💼 Main"
alias = "gc"
alias_auto_connect = true
path = "$WORK_MAIN"
windows = [" GH Dash"]

[[session]]
name = "💼 Notif"
alias = "gn"
alias_auto_connect = true
path = "$WORK_NOTIF"

[[session]]
name = "💼 Lib"
alias = "gl"
alias_auto_connect = true
path = "$WORK_LIB"

[[session]]
name = "💼 Translate"
alias = "tt"
path = "$WORK_TRANSLATE"


[[session]]
name= "🔑 Reset Admin Pass"
alias = "rstpw"
path = "$WORK_BIN"
startup_command="./reset-admin-password.sh; read -P 'devam icin enter...'; exit"

[[window]]
name = " GH Dash"
startup_script = "gh dash"

# Worktree'ye girince dogrudan dosya secicide acilsin.
# Not: [[wildcard]] icinde yalnizca startup_command isliyor - preview_command
# wildcard yolunda hic okunmuyor (previewer sadece isimli [[session]]'a bakiyor).
[[wildcard]]
pattern = "$WORK_MAIN/.worktrees/*"
startup_command = "nvim +GoToFile"

# `sesh worktree` kurulu surumde (2.28.0) YOK - upstream'de merge edildi (#435)
# ama henuz release edilmemis. Brew ile yeni surum gelince yorumu kaldir:
#   sesh worktree connect --pr 3198  ->  .worktrees/3198 altinda gh pr checkout
# Mevcut branch-adli worktree'lerle cakismaz (onlar .worktrees/<branch-adi>).
# worktree_dir + base_branch override sart: sesh defaultlari .wk ve origin/main.
#
# [[worktree]]
# repo = "$WORK_ORG/$WORK_MAIN_REPO"
# path = "$WORK_MAIN"
# worktree_dir = ".worktrees"
# base_branch = "origin/master"
# branch_template = "GD-{number}"
# create_command = "nvim +GoToFile"
# startup_command = "nvim +GoToFile"
#
# [[worktree]]
# repo = "$WORK_ORG/$WORK_TELI_REPO"
# path = "$WORK_TELI"
# worktree_dir = ".worktrees"
# base_branch = "origin/master"
# create_command = "nvim +GoToFile"
# startup_command = "nvim +GoToFile"
#
# Zen (Firefox tabanli) AppleScript ile aktif sekme URL'si vermiyor - sdef yok,
# hem `active tab` hem `front document` -1728 donuyor. --browser calismaz,
# PR numarasini elle vermek gerekir.
# [browser]
# application = "Zen"
