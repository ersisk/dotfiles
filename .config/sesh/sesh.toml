# Bilinmeyen anahtarda sessizce gecmek yerine hata ver.
strict_mode = true

# Worktree oturumlari repo kokunden degil kendi ust dizininden isim alsin:
# "<repo>/_worktrees/fix-GD-536-apk-cache" -> "fix-GD-536-apk-cache".
git_namer_use_worktree_root = true

[default_session]
preview_command = "eza -la --all --git --icons --color=always {}"

[[session]]
name = "📝 Notes"
alias = "nt"
alias_auto_connect = true
path = "~/obsidian-vault"
startup_command = 'nvim +GoToFile'

[[session]]
name = "🏠 Home (~)"
alias = "hme"
path = "~/"

[[session]]
name = "🔧 Config"
alias = "cf"
alias_auto_connect = true
path = "~/.config"
startup_command = 'nvim +GoToFile'

[[session]]
name = "📂 Workspace"
alias = "ws"
path = "~/workspace"

[[session]]
name = "📥 Downloads"
alias = "dl"
path = "~/Downloads"
startup_command = "yazi"

[[session]]
name = "🧩 Dotfiles"
alias = "df"
alias_auto_connect = true
path = "~/workspace/dotfiles"
startup_command = "nvim +GoToFile"

[[session]]
name = "🐳 LazyDocker"
alias = "lzd"
alias_auto_connect = true
path = "~/Library/Application Support/lazydocker"
startup_command = "lazydocker"
preview_command = "bat --language=yaml --style=snip --color=always ~/Library/Application Support/lazydocker/config.yml"

[[session]]
name = "🗄 LazySQL"
alias = "lsq"
alias_auto_connect = true
path = "~/Library/Application Support/lazysql"
startup_command = "lazysql"
preview_command = "bat --language=bash --style=snip --color=always ~/Library/Application Support/lazysql/config.toml"

[[session]]
name = "📰 Rss Feeds"
alias = "rss"
path = "~/.newsboat"
startup_command = "newsboat -r"
preview_command = "~/.config/sesh/rss-preview.sh"


[[session]]
name = "🎤 Presents"
alias = "prs"
path = "~/Documents/presents"
startup_command = "nvim +GoToFile"

[[session]]
name = "💼 Main"
alias = "gc"
alias_auto_connect = true
path = "$WORK_MAIN"
# gh dash 1. pencerede olsun: `windows` listesi hep 1'den sonra aciliyor,
# startup_command ise pencere 1'e gidiyor. Isimli pencere olusturmak
# automatic-rename'i kapattigi icin kabuk penceresinde geri aciyoruz -
# nerd-font/claude-state glyph'leri oradan geliyor.
startup_command = "tmux set -w -t 2 automatic-rename on; gh dash"
windows = ["shell"]

[[session]]
name = "💼 Notif"
alias = "gn"
alias_auto_connect = true
path = "$WORK_NOTIF"

[[session]]
name = "💼 Lib"
alias = "gl"
alias_auto_connect = true
path = "$WORK_LIB"

[[session]]
name = "💼 Translate"
alias = "tt"
path = "$WORK_TRANSLATE"


[[session]]
name= "🔑 Reset Admin Pass"
alias = "rstpw"
path = "$WORK_BIN"
startup_command="./reset-admin-password.sh; read -P 'devam icin enter...'; exit"

[[window]]
name = "shell"

# Worktree'ye girince dogrudan dosya secicide acilsin.
# Not: [[wildcard]] icinde yalnizca startup_command isliyor - preview_command
# wildcard yolunda hic okunmuyor (previewer sadece isimli [[session]]'a bakiyor).
[[wildcard]]
pattern = "$WORK_MAIN/.worktrees/*"
startup_command = "nvim +GoToFile"

# `sesh worktree` 2.29.0 ile geldi ama acmak bu repoya org/repo adini
# yazmak demek: `repo` alani env-expand EDILMIYOR (yalnizca `path` ediliyor) ve
# `sesh worktree list`/`picker` repo bossa hata veriyor. `[[import]]` de cozmuyor -
# import yalnizca session/window/wildcard bloklarini birlestiriyor, worktree'yi
# atliyor. Repo public oldugu icin karar verilene kadar kapali.
#   sesh worktree connect --pr 3198  ->  .worktrees/3198 altinda gh pr checkout
# Mevcut branch-adli worktree'lerle cakismaz (onlar .worktrees/<branch-adi>) ve
# `list` yalnizca sayi-adli dizinleri sayar, yani onlari hic gormez.
# worktree_dir + base_branch override sart: sesh defaultlari .wk ve origin/main.
# branch_template'e gerek yok: Connect once `gh pr view` deniyor, PR ise detached
# + `gh pr checkout` yapip template'i hic kullanmiyor; issue'larimiz Jira'da.
#
# [[worktree]]
# repo = "<org>/<main-repo>"   # literal sart, $WORK_* burada islemiyor
# path = "$WORK_MAIN"
# worktree_dir = ".worktrees"
# base_branch = "origin/master"
# create_command = "nvim +GoToFile"
# startup_command = "nvim +GoToFile"
#
# [[worktree]]
# repo = "<org>/<teli-repo>"   # literal sart, $WORK_* burada islemiyor
# path = "$WORK_TELI"
# worktree_dir = ".worktrees"
# base_branch = "origin/master"
# create_command = "nvim +GoToFile"
# startup_command = "nvim +GoToFile"
#
# Zen (Firefox tabanli) AppleScript ile aktif sekme URL'si vermiyor - sdef yok,
# hem `active tab` hem `front document` -1728 donuyor. --browser calismaz,
# PR numarasini elle vermek gerekir.
# [browser]
# application = "Zen"
