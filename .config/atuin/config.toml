## https://docs.atuin.sh/configuration/config/
# Sync off: no account, no identity, history stays on this machine only.
auto_sync = false
update_check = false

# Ctrl-R opens scoped to the git repo tree you are in; Ctrl-R on the search screen
# switches to the full (global) history. The order is set by search.filters below.
workspaces = true
filter_mode = "workspace"
search_mode = "fuzzy"
style = "compact"
inline_height = 20
show_preview = true
enter_accept = false

# So that secrets never enter the database in the first place.
secrets_filter = true

history_filter = [
  "^\\s",
]

[search]
filters = ["workspace", "global", "directory", "host"]

[theme]
name = "kanagawa"
