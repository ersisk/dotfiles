prSections:
    - title: My Pull Requests
      filters: is:open author:@me
    - title: Needs My Review
      filters: is:open review-requested:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
issuesSections:
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        open: true
        width: 50
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30
keybindings:
    prs:
        - key: C
          name: code review
          # -d: odak kalsin, arka arkaya birden fazla review baslatilabilsin.
          # remain-on-exit failed: -d ile acilan pencere hemen patlarsa gormezsin;
          # basarisiz olan pencere ekranda kalir, basarili olan eskisi gibi kapanir.
          # xargs yer tutucusu % — {} gh-dash sablonuyla karismasin.
          command: >-
            tmux new-window -d -P -F '#{window_id}' -c "{{.RepoPath}}" -n "PR-{{.PrNumber}}" "claude --dangerously-skip-permissions 'Detaylı Review #{{.PrNumber}}'" | xargs -I% tmux set-window-option -t % remain-on-exit failed
        - key: D
          name: codediff in nvim
          command: >-
            tmux new-window -c "{{.RepoPath}}" -n "diff-{{.PrNumber}}" "nvim -c 'CodeDiffSolo origin/{{.BaseRefName}} origin/{{.HeadRefName}}'"
theme:
    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: false
    # Kanagawa Wave; gh-dash varsayilani sabit hex kullaniyor, terminal paletini miras almiyor.
    colors:
        text:
            primary: "#dcd7ba"
            secondary: "#7e9cd8"
            inverted: "#1f1f28"
            faint: "#727169"
            warning: "#ff5d62"
            success: "#98bb6c"
        background:
            selected: "#2a2a37"
        border:
            primary: "#ffa066"
            secondary: "#54546d"
            faint: "#2a2a37"
pager:
    diff: "diffnav"
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
