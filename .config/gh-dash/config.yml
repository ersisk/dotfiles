prSections:
    - title: My Pull Requests
      filters: is:open author:@me
    - title: Needs My Review
      filters: is:open review-requested:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
issuesSections:
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        open: true
        width: 50
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30
keybindings:
    prs:
        - key: C
          name: code review
          # -d: keep the focus here so several reviews can be started back to back.
          # remain-on-exit failed: a window opened with -d that dies immediately goes
          # unseen; a failed one stays on screen, a successful one closes as before.
          # The xargs placeholder is % — so {} does not clash with the gh-dash template.
          command: >-
            tmux new-window -d -P -F '#{window_id}' -c "{{.RepoPath}}" -n "PR-{{.PrNumber}}" "claude --dangerously-skip-permissions 'Detaylı Review #{{.PrNumber}}'" | xargs -I% tmux set-window-option -t % remain-on-exit failed
        - key: D
          name: codediff in nvim
          command: >-
            tmux new-window -c "{{.RepoPath}}" -n "diff-{{.PrNumber}}" "nvim -c 'CodeDiffSolo origin/{{.BaseRefName}} origin/{{.HeadRefName}}'"
theme:
    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: false
    # Kanagawa Wave; gh-dash's default uses fixed hex and does not inherit the terminal palette.
    colors:
        text:
            primary: "#dcd7ba"
            secondary: "#7e9cd8"
            inverted: "#1f1f28"
            faint: "#727169"
            warning: "#ff5d62"
            success: "#98bb6c"
        background:
            selected: "#2a2a37"
        border:
            primary: "#ffa066"
            secondary: "#54546d"
            faint: "#2a2a37"
pager:
    diff: "diffnav"
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
