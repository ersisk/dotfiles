# colors
set -g default-terminal "tmux-256color"
set-option -a terminal-features 'xterm-256color:RGB'

set -g history-limit 1000000
set -g mouse on
set -g base-index 1
set -g detach-on-destroy off  # don't exit from tmux when closing a session
set -g renumber-windows on   # renumber all windows when any window is closed
set -g set-clipboard on      # use system clipboard
set -g status-interval 3     # update the status bar every 3 seconds
set -g status-right-length 80  # yol + git branch, renk kodlarıyla default 40'ı aşıyor
set -g display-time 4000     # keep status-line messages readable (default 750ms is too short)
set -g status-style 'bg=default' # transparent
set-option -g focus-events on
unbind C-b
set -g prefix C-a

# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

#Bindings
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"
unbind v
bind v copy-mode
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt (cmd+w)
bind P paste-buffer
# Is yollarini tmux ortamina aktarir; dosya yoksa sessizce atlanir.
run-shell '~/.config/tmux/load-work-env.sh'
source ~/.config/tmux/utility.conf
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'niksingh710/minimal-tmux-status'
# Plugins Settings
set -g @yank_action 'copy-pipe-and-cancel'
set -g @minimal-tmux-bg "#6A9589"
set -g @minimal-tmux-indicator-str "  "
set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-left-arrow ""
# Sağ taraf: mevcut klasör + git branch. #{b:...} basename'i tmux içinde alır (process yok).
set -g @minimal-tmux-status-right "#[fg=#7E9CD8] #{b:pane_current_path}#(~/.config/tmux/git-status.sh)#[default]"
# Pane komutu degisince otomatik yeniden adlandirmayi tetikler; ciktisi bos
# oldugu icin status bar gorunumune dokunmaz (bkz window-name-refresh.sh).
# Claude durumu burada degil: menubar uygulamasi ayni bilgiyi ekranin tepesinde
# gosteriyor, iki yerde birden sinyal vermek istemiyoruz. Klavyeden gitmek icin
# prefix+j (claude-next.sh) duruyor.
set -g @minimal-tmux-status-right-extra "#(~/.config/tmux/window-name-refresh.sh)"
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'
run '~/.tmux/plugins/tpm/tpm'

# After tpm: wrap tmux-nerd-font-window-name's format so Claude Code's per-window
# state glyph (@claude_state, set by claude-tmux-notify) is prepended by tmux itself.
# This survives the plugin's automatic re-renames — the glyph lives in the option, not #W.
set -g automatic-rename-format "#{?@claude_state,#{@claude_state} ,}#(~/.config/tmux/plugins/tmux-nerd-font-window-name/bin/tmux-nerd-font-window-name #{pane_current_command} #{window_panes})"

# Kanagawa message styling. `fill` matters: without it the line past the message
# keeps tmux's default yellow, which shows up as a bright tail on styled messages.
set -g message-style "bg=#1f1f28,fg=#dcd7ba,fill=#1f1f28"
set -g message-command-style "bg=#1f1f28,fg=#e6c384,fill=#1f1f28"

