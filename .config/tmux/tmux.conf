# colors
set -g default-terminal "tmux-256color"
set-option -a terminal-features 'xterm-256color:RGB'

set -g history-limit 1000000
set -g mouse on
set -g base-index 1
set -g detach-on-destroy off  # don't exit from tmux when closing a session
set -g renumber-windows on   # renumber all windows when any window is closed
set -g set-clipboard on      # use system clipboard
set -g status-interval 3     # update the status bar every 3 seconds
set -g status-right-length 140  # path + git branch; #[fg=...] sequences count too
set -g display-time 4000     # keep status-line messages readable (default 750ms is too short)
# Transparent; a dim full-width underline separates the bar from the panes without an extra row.
set -g status-style 'bg=default,underscore,us=#363646'
set -g popup-style default         # tmux 3.8 defaults popups to themedarkgrey, hiding kitty's wallpaper
set -g popup-border-style "fg=#54546d"
set -g popup-border-lines rounded
set -g menu-style "bg=#1f1f28,fg=#dcd7ba"
set -g menu-selected-style "bg=#2d4f67,fg=#c8c093"
set -g menu-border-style "fg=#54546d"
set -g menu-border-lines rounded
set-option -g focus-events on
unbind C-b
set -g prefix C-a

# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

#Bindings
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"
unbind v
bind v copy-mode
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt (cmd+w)
bind P paste-buffer
# Carries the work paths into the tmux environment; skipped quietly when the file is missing.
run-shell '~/.config/tmux/load-work-env.sh'
source ~/.config/tmux/utility.conf
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
# Plugins Settings
set -g @yank_action 'copy-pipe-and-cancel'
# Status bar: plain text over the transparent background; session (left) and the active
# window share the same soft pill. Worktree session names can be long, hence the =20 trim.
# Prefix pending turns the session name yellow instead of a separate indicator.
# Hex colours are lowercase on purpose: inside formats #D, #F, #H… are aliases,
# so an uppercase colour like #DCD7BA would expand #D to the pane id.
set -g status-position top
set -g status-justify centre
set -g status-left-length 40
set -g status-left "#[fg=#363646]\ue0b6#[bg=#363646,fg=#{?client_prefix,#e6c384,#957fb8}]#{=20:session_name}#[fg=#363646,bg=default]\ue0b4#{?pane_in_mode,#[fg=#e6c384] 󰆏 COPY,}#{?synchronize-panes,#[fg=#e46876] 󰓦 SYNC,}#[default]"
# Names are capped at 15 columns so long agent/command names do not push into the sides.
# Index stays dim; #[default] hands the name back to window-status-style so bell colouring still applies.
set -g window-status-format " #[fg=#54546d]#I#[default] #{=/15/…:window_name}#{?window_zoomed_flag, 󰊓,}#{?window_last_flag,#[fg=#54546d] 󰁯,} "
# Soft rounded pill; the caps take the padding spaces so the width matches inactive windows.
set -g window-status-current-format "#[fg=#363646]#[bg=#363646,fg=#7fb4ca]#I #[fg=#dcd7ba,bold]#{=/15/…:window_name}#{?window_zoomed_flag, 󰊓,}#[nobold,fg=#363646,bg=default]"
# Right side: current folder + git branch. #{b:...} runs inside tmux and spawns no process.
# Below 120 columns the path is dropped so the right side does not run into the centred windows.
# window-name-refresh.sh triggers automatic renaming when the pane command changes; its
# output is empty, so it does not touch the bar's appearance. Claude state is not here:
# the menu bar app shows it, and prefix+j (agent-next.sh) is the keyboard route.
set -g status-right "#{?#{e|<:#{client_width},120},,#[fg=#7e9cd8] #{b:pane_current_path}} #(~/.config/tmux/git-status.sh)#[default]#(~/.config/tmux/window-name-refresh.sh)"
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'
run '~/.tmux/plugins/tpm/tpm'

# After tpm: wrap tmux-nerd-font-window-name's format so the agent's per-window
# state glyph (@agent_state, set by agent-tmux-notify) is prepended by tmux itself.
# This survives the plugin's automatic re-renames — the glyph lives in the option, not #W.
# The s/// strips opencode's real binary name (opencode.exe, a Bun single-file
# build) so the window reads "opencode"; the substitution runs in tmux and costs
# no extra process.
set -g automatic-rename-format "#{?@agent_state,#{@agent_state} ,}#(~/.config/tmux/plugins/tmux-nerd-font-window-name/bin/tmux-nerd-font-window-name #{s/opencode.exe/opencode/:pane_current_command} #{window_panes})"

# Kanagawa message styling. `fill` matters: without it the line past the message
# keeps tmux's default yellow, which shows up as a bright tail on styled messages.
set -g message-style "bg=#1f1f28,fg=#dcd7ba,fill=#1f1f28"
set -g message-command-style "bg=#1f1f28,fg=#e6c384,fill=#1f1f28"

set -g window-status-style "fg=#727169"
set -g window-status-bell-style "fg=#E46876,bold"
# Kanagawa colours; the copy/sync/modal/marked colour states of tmux's default stay as they are.
set -g pane-border-style "fg=#54546D"
set -g pane-active-border-style "fg=#{?pane_modal_flag,themeblue,#{?pane_marked,thememagenta,#{?synchronize-panes,themered,#{?pane_in_mode,themeyellow,#6A9589}}}}"
set -g mode-style "bg=#2D4F67,fg=#C8C093"
set -g copy-mode-match-style "bg=#223249,fg=#dcd7ba"
set -g copy-mode-current-match-style "bg=#ff9e3b,fg=#1f1f28,bold"
set -g copy-mode-mark-style "bg=#957fb8,fg=#1f1f28"
set -g copy-mode-position-style "bg=#363646,fg=#7fb4ca"
set -g display-panes-colour "#54546d"
set -g display-panes-active-colour "#7fb4ca"
set -g pane-border-indicators arrows
# Unfocused panes get a dimmer default text colour; the transparent background is kept.
set -g window-style "fg=#727169"
# "default" would inherit window-style's grey; "terminal" is the terminal's own colour.
set -g window-active-style "fg=terminal"
# Pane titles only when a window is split (and not zoomed), so single panes keep the row.
# Bottom, so they do not stack with the empty status row above the panes.
set -g pane-border-format " #{?pane_active,#[fg=#7fb4ca],#[fg=#54546d]}#{pane_current_command} #[fg=#54546d]#{b:pane_current_path} "
set -g pane-border-status off
set-hook -g window-layout-changed 'set -w -F pane-border-status "#{?#{&&:#{>:#{window_panes},1},#{!:#{window_zoomed_flag}}},bottom,off}"'

set -g status on
bind b set -g status
