# Ingilizce yazim hatalari; agirlik kod ve commit mesajlarinda gecen kelimelerde.
#
# propagate_case burada acik: "Teh" -> "The" calisiyor, Turkce i/I sorunu
# Ingilizce'de yok (bkz typo-tr.yml).
#
# Iki kelimenin de gecerli oldugu cift (form/from gibi) BILEREK yok: duzeltme
# dogru yazilmis bir kelimeyi bozamamali.
matches:
  - trigger: "teh"
    replace: "the"
    word: true
    propagate_case: true
  - trigger: "taht"
    replace: "that"
    word: true
    propagate_case: true
  - trigger: "adn"
    replace: "and"
    word: true
    propagate_case: true
