# Merges with Yazi's defaults: adding a new name under [opener] does not remove the
# existing openers, and prepend_rules does not override the default rule list (it
# only goes in front of it). So only the additions live here.

[opener]
browser = [
  # Zen is the default browser (http/https -> app.zen-browser.zen in LaunchServices).
  # The bundle id is used: it keeps working even if the app name changes.
  # The file path arrives via %s - yazi hands `run` to `sh -c` as is and passes no
  # positional argument, so "$@" is always empty here.
  { run = 'open -b app.zen-browser.zen %s', desc = "Open in browser", orphan = true, for = "macos" },
]

[open]
# Only the types that make sense in a browser. Rules are evaluated in order and the
# first wins, so a "*" would take over the default behaviour entirely; hence they
# are added type by type, each keeping the default opener in the list too.
prepend_rules = [
  { mime = "text/html",       use = [ "browser", "edit", "reveal" ] },
  { mime = "application/pdf", use = [ "browser", "open", "reveal" ] },
  { mime = "image/svg+xml",   use = [ "browser", "open", "edit", "reveal" ] },
  { mime = "application/json", use = [ "edit", "browser", "reveal" ] },
  { mime = "text/csv",        use = [ "edit", "browser", "reveal" ] },
]
