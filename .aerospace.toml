# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

config-version = 2

# v1 inferred this from the workspace bindings; v2 falls back to [], so keep it explicit.
persistent-workspaces = ["A", "B", "C", "D", "G", "I", "M", "N", "P", "Q", "R", "S", "T", "U", "V", "W", "X", "Y", "Z"]

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# The mouse follows when window focus changes. 'lazy': the cursor stays put when
# it is already inside the target window.
on-focus-changed = ['move-mouse window-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodness#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# You can uncomment the following lines to open up terminal with alt + enter shortcut (like in i3)
# alt-enter = '''exec-and-forget osascript -e '
# tell application "Terminal"
#     do script
#     activate
# end tell'
# '''

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
ctrl-minus = 'layout tiles horizontal vertical'
ctrl-comma = 'layout accordion horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
# wrap-around-the-workspace: on an edge window the key should wrap instead of doing nothing.
cmd-alt-ctrl-h = 'focus --boundaries-action wrap-around-the-workspace left'
cmd-alt-ctrl-j = 'focus --boundaries-action wrap-around-the-workspace down'
cmd-alt-ctrl-k = 'focus --boundaries-action wrap-around-the-workspace up'
cmd-alt-ctrl-l = 'focus --boundaries-action wrap-around-the-workspace right'

cmd-alt-ctrl-f = 'fullscreen'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
cmd-alt-ctrl-shift-h = 'move left'
cmd-alt-ctrl-shift-j = 'move down'
cmd-alt-ctrl-shift-k = 'move up'
cmd-alt-ctrl-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
cmd-alt-ctrl-shift-minus = 'resize smart -50'
cmd-alt-ctrl-shift-0 = 'resize smart +50'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
# Numbered ones are i3-style: left out of persistent-workspaces, so they exist only
# while they hold a window or have focus.
cmd-alt-ctrl-1 = 'workspace 1'
cmd-alt-ctrl-2 = 'workspace 2'
cmd-alt-ctrl-3 = 'workspace 3'
cmd-alt-ctrl-4 = 'workspace 4'
cmd-alt-ctrl-5 = 'workspace 5'
cmd-alt-ctrl-6 = 'workspace 6'
cmd-alt-ctrl-7 = 'workspace 7'
cmd-alt-ctrl-8 = 'workspace 8'
cmd-alt-ctrl-9 = 'workspace 9'
# cmd-alt-ctrl is Caps Lock held (Karabiner, .config/karabiner). Plain alt is AltGr
# on Turkish-Q (₺, @, ...), so no binding here uses it on its own.
cmd-alt-ctrl-a = 'workspace A' # Browsers (firefox, safari, brave, helium)
cmd-alt-ctrl-b = 'workspace B' # Browser, Slack
cmd-alt-ctrl-c = 'workspace C' # Terminal (kitty, wezterm, rex)
cmd-alt-ctrl-d = 'workspace D' # Database (Beekeeper studio)
# cmd-alt-ctrl-e -> used as focus-monitor (below)
# cmd-alt-ctrl-f -> used as fullscreen (above)
cmd-alt-ctrl-g = 'workspace G' # KeePassXC (Password manager)
cmd-alt-ctrl-i = 'workspace I' # Intellij
cmd-alt-ctrl-m = 'workspace M' # messaging /media (texting and spotify)
cmd-alt-ctrl-n = 'workspace N' # Notes (Obsidian, notesnook)
# cmd-alt-ctrl-o -> used as focus-back-and-forth (below)
cmd-alt-ctrl-p = 'workspace P' # Bruno
cmd-alt-ctrl-q = 'workspace Q'
cmd-alt-ctrl-r = 'workspace R' # Reading / office (preview, libreoffice)
cmd-alt-ctrl-s = 'workspace S'
cmd-alt-ctrl-t = 'workspace T' # AI (claude desktop, ollama)
cmd-alt-ctrl-u = 'workspace U'
cmd-alt-ctrl-v = 'workspace V'
cmd-alt-ctrl-w = 'workspace W' # Mail (apple mail, thunderbird)
cmd-alt-ctrl-x = 'workspace X' # Scratch (unassigned windows; not pinned to a monitor)
cmd-alt-ctrl-y = 'workspace Y'
cmd-alt-ctrl-z = 'workspace Z'


# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
cmd-alt-ctrl-shift-1 = 'move-node-to-workspace 1'
cmd-alt-ctrl-shift-2 = 'move-node-to-workspace 2'
cmd-alt-ctrl-shift-3 = 'move-node-to-workspace 3'
cmd-alt-ctrl-shift-4 = 'move-node-to-workspace 4'
cmd-alt-ctrl-shift-5 = 'move-node-to-workspace 5'
cmd-alt-ctrl-shift-6 = 'move-node-to-workspace 6'
cmd-alt-ctrl-shift-7 = 'move-node-to-workspace 7'
cmd-alt-ctrl-shift-8 = 'move-node-to-workspace 8'
cmd-alt-ctrl-shift-9 = 'move-node-to-workspace 9'
cmd-alt-ctrl-shift-a = 'move-node-to-workspace A'
cmd-alt-ctrl-shift-b = 'move-node-to-workspace B'
cmd-alt-ctrl-shift-c = 'move-node-to-workspace C'
cmd-alt-ctrl-shift-d = 'move-node-to-workspace D'
# cmd-alt-ctrl-shift-e -> used as move-node-to-monitor (below)
# cmd-alt-ctrl-shift-f = 'move-node-to-workspace F'
cmd-alt-ctrl-shift-g = 'move-node-to-workspace G'
cmd-alt-ctrl-shift-i = 'move-node-to-workspace I'
cmd-alt-ctrl-shift-m = 'move-node-to-workspace M'
cmd-alt-ctrl-shift-n = 'move-node-to-workspace N'
cmd-alt-ctrl-shift-p = 'move-node-to-workspace P'
cmd-alt-ctrl-shift-q = 'move-node-to-workspace Q'
cmd-alt-ctrl-shift-r = 'move-node-to-workspace R'
cmd-alt-ctrl-shift-s = 'move-node-to-workspace S'
cmd-alt-ctrl-shift-t = 'move-node-to-workspace T'
cmd-alt-ctrl-shift-u = 'move-node-to-workspace U'
cmd-alt-ctrl-shift-v = 'move-node-to-workspace V'
cmd-alt-ctrl-shift-w = 'move-node-to-workspace W'
cmd-alt-ctrl-shift-x = 'move-node-to-workspace X'
cmd-alt-ctrl-shift-y = 'move-node-to-workspace Y'
cmd-alt-ctrl-shift-z = 'move-node-to-workspace Z'

ctrl-left = 'workspace prev'
ctrl-right = 'workspace next'

# " instead of Tab: with a modifier held, Logi POP Keys drops ~25% of Tab presses
# entirely (no event is born at the HID layer, regardless of transport).
# sectionSign is keycode 10, left of Z, which is " on Turkish-Q. ctrl, not cmd or
# alt: kitty maps cmd-" to the tmux split, and alt is AltGr on this layout.
# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
ctrl-sectionSign = 'workspace-back-and-forth'
# The window-level counterpart of ctrl-": toggles between the last two windows.
cmd-alt-ctrl-o = 'focus-back-and-forth'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus-monitor
cmd-alt-ctrl-e = 'focus-monitor --wrap-around next'
cmd-alt-ctrl-shift-e = 'move-node-to-monitor --wrap-around next'
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
# Temporary move for force-assigned workspaces: on reload / monitor reconnect it
# returns to the monitor it is assigned to.
ctrl-shift-e = 'move-workspace-to-monitor --wrap-around next'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
ctrl-alt-0 = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
h = ['layout horizontal', 'mode main']
v = ['layout vertical', 'mode main']
a = ['layout accordion', 'mode main']
t = ['layout tiles', 'mode main']
f = ['fullscreen', 'mode main']
m = [
  'layout floating tiling',
  'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

cmd-alt-ctrl-shift-h = ['join-with left', 'mode main']
cmd-alt-ctrl-shift-j = ['join-with down', 'mode main']
cmd-alt-ctrl-shift-k = ['join-with up', 'mode main']
cmd-alt-ctrl-shift-l = ['join-with right', 'mode main']
cmd-alt-ctrl-shift-f = 'fullscreen'

# Monitor order (1, 2, ...) shifts with the physical layout; moving a screen moves
# the assignments with it. Hence a stable pattern instead of an ID.
# With no external display it falls back to main.
# See: https://nikitabobko.github.io/AeroSpace/guide#assign-work
# The external display is 1920x1080 -> logically wider than the built-in Retina.
# So wide/reference content goes outside, heavy reading and writing on the Retina.
[workspace-to-monitor-force-assignment]
A = ['secondary', 'main']
D = ['secondary', 'main']
I = ['secondary', 'main']
M = ['secondary', 'main']
W = ['secondary', 'main']
Z = ['secondary', 'main']

B = 'built-in'
C = 'built-in'
G = 'built-in'
N = 'built-in'
P = 'built-in'

# ==============================================================================
# FLOATING WINDOWS
# See: https://nikitabobko.github.io/AeroSpace/guide#floating-w
# ==============================================================================
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating']                 # The callback itself

[[on-window-detected]]
if.app-id = 'com.fortinet.FortiClient'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.mjrusso.Scoot'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.alienator88.Pearcleaner'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.superset.desktop'
run = 'layout floating'

# ==============================================================================
# APP ASSIGNMENTS
# To find the app ids run: aerospace list-apps
# ==============================================================================

# --- WEB BROWSERS (WORKSPACES: A, B) ---
# Zen Browser is assigned to workspace B, while others are assigned to A.

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = "move-node-to-workspace B"

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = "move-node-to-workspace A"

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = "move-node-to-workspace A"

[[on-window-detected]]
if.app-id = 'net.imput.helium'
run = "move-node-to-workspace A"

[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = "move-node-to-workspace A"

# --- TERMINALS (WORKSPACE: C) ---

[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = "move-node-to-workspace C"

[[on-window-detected]]
if.app-id = 'net.kovidgoyal.kitty'
run = "move-node-to-workspace C"

[[on-window-detected]]
if.app-id = 'com.superlogical.rex'
run = "move-node-to-workspace C"

# --- COMMUNICATION & EMAIL (WORKSPACES: Z, W) ---

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ["move-node-to-workspace B", "layout floating"]

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = ["move-node-to-workspace W", "layout floating"]


[[on-window-detected]]
if.app-id = 'org.mozilla.thunderbird'
run = ["move-node-to-workspace W", "layout floating"]

# --- MESSAGING & MEDIA (WORKSPACE: M) ---

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = "move-node-to-workspace M"

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = ["move-node-to-workspace M", "layout floating"]

[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = ["move-node-to-workspace M", "layout floating"]

# --- DEVELOPMENT TOOLS & IDEs (WORKSPACE: I) ---

[[on-window-detected]]
if.app-id = 'com.neovide.neovide'
run = 'move-node-to-workspace I'
check-further-callbacks = true

# Launched from the terminal via the binary inside the bundle, macOS reports no
# bundle id (NULL-APP-BUNDLE-ID), so the app-id rule does not match; catch it by name.
[[on-window-detected]]
if.app-name-regex-substring = '[Nn]eovide'
run = 'move-node-to-workspace I'

[[on-window-detected]]
if.app-id = 'com.jetbrains.intellij'
run = "move-node-to-workspace I"

[[on-window-detected]]
if.app-id = 'com.google.antigravity'
run = "move-node-to-workspace I"

[[on-window-detected]]
if.app-id = 'com.jetbrains.PhpStorm'
run = "move-node-to-workspace I"

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = "move-node-to-workspace I"

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = "move-node-to-workspace I"

# --- DATABASE MANAGEMENT (WORKSPACE: D) ---
[[on-window-detected]]
if.app-id = 'io.beekeeperstudio.desktop'
run = ["move-node-to-workspace D", "layout floating"] # Beekeeper studio has some weird behavior with AeroSpace, so I set it to floating layout]

[[on-window-detected]]
if.app-id = 'com.TablePro'
run = ["move-node-to-workspace D", "layout floating"] # TablePro has some weird behavior with AeroSpace, so I set it to floating layout]

[[on-window-detected]]
if.app-id = 'org.jkiss.dbeaver.core.product'
run = "move-node-to-workspace D"

[[on-window-detected]]
if.app-id = 'ai.reyz.tusk'
run = "move-node-to-workspace D"

[[on-window-detected]]
if.app-id = 'com.dbx.app'
run = "move-node-to-workspace D"

# --- API TESTING & TOOLS (WORKSPACE: P) ---

[[on-window-detected]]
if.app-id = 'com.usebruno.app'
run = "move-node-to-workspace P"

# --- AI (WORKSPACE: T) ---

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = "move-node-to-workspace T"

[[on-window-detected]]
if.app-id = 'com.electron.ollama'
run = "move-node-to-workspace T"

# --- READING & OFFICE (WORKSPACE: R) ---

[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = "move-node-to-workspace R"

[[on-window-detected]]
if.app-id = 'org.libreoffice.script'
run = "move-node-to-workspace R"

# --- NOTE TAKING & PRODUCTIVITY (WORKSPACE: N) ---

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = "move-node-to-workspace N"

# --- SECURITY & UTILITIES (WORKSPACE: G) ---

[[on-window-detected]]
if.app-id = 'org.keepassxc.keepassxc'
run = "move-node-to-workspace G"

[[on-window-detected]]
if.app-id = 'com.bitwarden.desktop'
run = "move-node-to-workspace G"
